name: exemplar-stack
version: 1

ledger:
  api_endpoint: http://localhost:7701
  mock_from_ledger: true

taint:
  enabled: true
  scan_requests: true
  scan_responses: true

# Control-plane auth: adapter control servers (e.g. reeve-prod's /taint on 28080)
# require Bearer <BATON_CONTROL_TOKEN>. Only reeve consumes the control plane today
# (exemplar/scram dispatch is stubbed), so enabling this globally is safe.
security:
  control:
    auth: true
    token_env: BATON_CONTROL_TOKEN

nodes:
  - name: reeve-prod
    port: 18080
    host: "::"
    role: ingress
    proxy_mode: http
    metadata:
      component: reeve
      upstream_url: https://reeve.fly.dev
      liveness_path: /health/live
      readiness_path: /health/ready
      smoke.config: configs/reeve-smoke.yaml
      canary.threshold_event_type: reeve.canary.thresholds.registered
      canary.threshold_payload_key: thresholds
      ledger.egress_config: configs/reeve-egress.yaml
